name: Build Android APK

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

# contents: write is needed to publish the APK as a release asset.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Prisma is server-only and downloads engine binaries on install, which the
      # offline mobile build neither needs nor can reach in CI.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web assets
        run: npm run build
        env:
          # Bake the build number into the bundle so the OTA updater knows which
          # version is running and only downloads strictly newer bundles.
          VITE_BUNDLE_VERSION: ${{ github.run_number }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Stage APK with a friendly name
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/loompos.apk

      - name: Package OTA web bundle + manifest
        run: |
          # Zip the built web assets (index.html at the zip root) for OTA download.
          ( cd dist && zip -qr ../dist-apk/bundle.zip . )
          SUM=$(sha256sum dist-apk/bundle.zip | cut -d' ' -f1)
          printf '{"version":%s,"url":"https://github.com/Chamso-dev/loom-pos/releases/download/android-latest/bundle.zip","checksum":"%s","critical":false}\n' \
            "${{ github.run_number }}" "$SUM" > dist-apk/latest.json
          echo "OTA bundle sha256=$SUM version=${{ github.run_number }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loompos-debug-apk
          path: dist-apk/loompos.apk
          if-no-files-found: error

      # Publish a rolling release so the latest APK has a stable, login-free
      # download URL. Only on direct pushes (PRs from forks can't write releases).
      - name: Publish APK to a rolling release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: LoomPOS Android (latest build)
          body: |
            Latest debug APK of the LoomPOS Android app, built automatically from
            `${{ github.ref_name }}` (commit ${{ github.sha }}).

            Download **loompos.apk** below and install it on your device
            (enable "Install unknown apps" for your browser/file manager first).
          prerelease: true
          files: |
            dist-apk/loompos.apk
            dist-apk/bundle.zip
            dist-apk/latest.json
          fail_on_unmatched_files: true
